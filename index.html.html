<script type="module">
import {initializeApp} from 'firebase/app';
import {getFirestore, collection, addDoc, doc, updateDoc, onSnapshot, serverTimestamp, query, orderBy, where, increment, arrayUnion, arrayRemove, getDocs} from 'firebase/firestore';

const firebaseConfig = {
  apiKey: "AIzaSyDDBiJpjNQV6JadaoHlC6wt4sTByXJHkDE",
  authDomain: "ah-traders-signels.firebaseapp.com",
  databaseURL: "https://ah-traders-signels-default-rtdb.firebaseio.com",
  projectId: "ah-traders-signels",

  messagingSenderId: "371770349501",
  appId: "1:371770349501:web:a0213fa81a90870143e4d4"
};

let db, courses=[], signals=[], updates=[], comments=[], helpMessages=[];
let tab='dashboard', connected=false;
let currentUser = 'User_' + Math.floor(Math.random()*9000+1000);
localStorage.setItem('ah_user_id', currentUser);
const dot=document.getElementById('dot'), connText=document.getElementById('connText'), errorBar=document.getElementById('errorBar'), errorMsg=document.getElementById('errorMsg');
const loadPercent=document.getElementById('loadPercent'), loadBar=document.getElementById('loadBar'), loadText=document.getElementById('loadText');

const canvas=document.getElementById('candleCanvas'), ctx=canvas.getContext('2d');
function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; } resize(); window.addEventListener('resize',resize);
const candles=[]; for(let i=0;i<50;i++) candles.push({x:Math.random()*canvas.width, y:canvas.height+Math.random()*200, w:2+Math.random()*3, h:12+Math.random()*18, speed:0.5+Math.random()*1.5, color:Math.random()>0.5?'#22c55e':'#ef4444', opacity:0.3+Math.random()*0.6});
function animate(){ ctx.clearRect(0,0,canvas.width,canvas.height); candles.forEach(function(c){c.y-=c.speed; if(c.y<-30){c.y=canvas.height+20; c.x=Math.random()*canvas.width;} ctx.globalAlpha=c.opacity; ctx.fillStyle=c.color; ctx.fillRect(c.x,c.y,c.w,c.h); }); ctx.globalAlpha=1; requestAnimationFrame(animate); } animate();

let progress=0; const texts=["Initializing...","Connecting to Firebase...","Syncing...","Loading...","Welcome!"]; let textIndex=0;
function updateProgress(){ if(progress<100){ progress+=Math.random()*4+0.5; if(progress>100) progress=100; loadPercent.innerText=Math.floor(progress)+'%'; loadBar.style.width=progress+'%'; if(progress>textIndex*20 && textIndex<texts.length-1){ textIndex++; loadText.innerText=texts[textIndex]; } if(progress<100) setTimeout(updateProgress, 30+Math.random()*40); } } updateProgress();

function showError(msg){ errorBar.classList.remove('hidden'); errorMsg.innerText=msg; dot.className='w-2 h-2 bg-red-500 rounded-full'; connText.innerText='OFFLINE'; }
function showConnected(){ errorBar.classList.add('hidden'); dot.className='w-2 h-2 bg-green-500 rounded-full animate-pulse'; connText.innerText='LIVE'; connected=true; }

// Photo Zoom
window.openZoom = function(src){ document.getElementById('zoomImg').src = src; document.getElementById('photoModal').classList.remove('hidden'); document.body.style.overflow='hidden'; }
window.closeZoom = function(){ document.getElementById('photoModal').classList.add('hidden'); document.body.style.overflow='auto'; }

try{
  var app=initializeApp(firebaseConfig); db=getFirestore(app);
  onSnapshot(query(collection(db,'courses'), orderBy('createdAt','desc')), function(snap){ courses=[]; snap.forEach(function(d){ courses.push({id:d.id, ...d.data()}); }); showConnected(); progress=Math.max(progress,85); if(!document.getElementById('app').classList.contains('hidden')) render(); });
  onSnapshot(query(collection(db,'signals'), orderBy('createdAt','desc')), function(snap){ signals=[]; snap.forEach(function(d){ signals.push({id:d.id, ...d.data()}); }); showConnected(); var badge=document.getElementById('signalBadge'); if(badge){ if(signals.length>0){badge.innerText=signals.length; badge.classList.remove('hidden');} else badge.classList.add('hidden'); } if(!document.getElementById('app').classList.contains('hidden')) render(); });
  onSnapshot(query(collection(db,'updates'), orderBy('createdAt','desc')), function(snap){ updates=[]; snap.forEach(function(d){ updates.push({id:d.id, ...d.data()}); }); showConnected(); if(!document.getElementById('app').classList.contains('hidden')) render(); });
  onSnapshot(query(collection(db,'comments'), orderBy('createdAt','desc')), function(snap){ comments=[]; snap.forEach(function(d){ comments.push({id:d.id, ...d.data()}); }); if(!document.getElementById('app').classList.contains('hidden')) render(); });
  onSnapshot(query(collection(db,'helpMessages'), where('userId','==', currentUser), orderBy('createdAt','desc')), function(snap){ helpMessages=[]; snap.forEach(function(d){ helpMessages.push({id:d.id, ...d.data()}); }); var newReplies = helpMessages.filter(function(m){ return m.replies && m.replies.length>0 && m.replies[m.replies.length-1].fromAdmin && !m.readByUser; }).length; var helpBadge=document.getElementById('helpBadge'); if(helpBadge){ if(newReplies>0){ helpBadge.innerText=newReplies; helpBadge.classList.remove('hidden'); helpBadge.classList.add('flex'); } else { helpBadge.classList.add('hidden'); helpBadge.classList.remove('flex'); } } if(!document.getElementById('app').classList.contains('hidden') && tab==='tools') render(); });
}catch(e){ showError(e.message); }

// Like function
window.likeContent = function(contentId, contentType){
  var likeKey = 'liked_'+contentId;
  var alreadyLiked = localStorage.getItem(likeKey);
  var col = contentType==='course'?'courses':contentType==='signal'?'signals':'updates';
  var docRef = doc(db, col, contentId);
  if(alreadyLiked){
    updateDoc(docRef, {likes: increment(-1)}).then(function(){ localStorage.removeItem(likeKey); });
  } else {
    updateDoc(docRef, {likes: increment(1)}).then(function(){ localStorage.setItem(likeKey, '1'); }).catch(function(){ addDoc(collection(db, col), {}); updateDoc(docRef, {likes: 1}); localStorage.setItem(likeKey, '1'); });
  }
};

// Comment functions
window.addComment = function(contentId, contentType){
  var input = document.getElementById('commentInput_'+contentId);
  var text = input.value.trim();
  if(!text) return;
  addDoc(collection(db, 'comments'), {contentId: contentId, contentType: contentType, text: text, userName: currentUser, userId: currentUser, createdAt: serverTimestamp()}).then(function(){ input.value=''; });
};

window.toggleComments = function(contentId){
  var div = document.getElementById('comments_'+contentId);
  div.classList.toggle('hidden');
};

function getCommentsFor(contentId){
  return comments.filter(function(c){ return c.contentId===contentId; });
}

function renderComments(contentId, contentType){
  var list = getCommentsFor(contentId);
  if(list.length===0) return '<p class="text-[11px] text-white/30 mt-3">No comments yet - Be first to comment!</p>';
  return '<div class="mt-3 space-y-2 max-h-[200px] overflow-y-auto pr-1">'+list.map(function(c){
    return '<div class="bg-black/60 p-2.5 rounded-xl border border-white/[0.05]"><div class="flex justify-between items-center"><span class="text-[10px] font-bold text-[#D4AF37]">'+(c.userName||'User')+'</span><span class="text-[9px] text-white/30">'+(c.createdAt?new Date(c.createdAt.seconds*1000).toLocaleDateString():'now')+'</span></div><p class="text-[12px] text-white/70 mt-1">'+c.text+'</p></div>';
  }).join('')+'</div>';
}

// Currency Converter
let rates = {USD: 277, EUR: 302, GBP: 352, BTC: 18500000, ETH: 850000, AED: 75.5, SAR: 73.8};
let lastFetch = 0;
function fetchRates(){
  if(Date.now()-lastFetch < 60000) return;
  lastFetch = Date.now();
  fetch('https://api.exchangerate-api.com/v4/latest/USD').then(function(r){ return r.json(); }).then(function(data){
    if(data && data.rates){
      var pkr = data.rates.PKR || 277;
      rates.USD = Math.round(pkr);
      rates.EUR = Math.round(pkr / (data.rates.EUR || 0.92));
      rates.GBP = Math.round(pkr / (data.rates.GBP || 0.79));
      rates.AED = Math.round(pkr / (data.rates.AED || 3.67));
      rates.SAR = Math.round(pkr / (data.rates.SAR || 3.75));
      // BTC approximate via coingecko
      fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=pkr').then(function(r){ return r.json(); }).then(function(crypto){
        if(crypto.bitcoin) rates.BTC = crypto.bitcoin.pkr;
        if(crypto.ethereum) rates.ETH = crypto.ethereum.pkr;
        updateConverterDisplay();
      }).catch(function(){});
      updateConverterDisplay();
    }
  }).catch(function(){ console.log('Rate fetch failed, using defaults'); });
}
function updateConverterDisplay(){
  var from = document.getElementById('fromCurrency');
  var amount = document.getElementById('convertAmount');
  var result = document.getElementById('convertResult');
  if(!from || !amount || !result) return;
  var val = parseFloat(amount.value) || 1;
  var curr = from.value;
  var rate = rates[curr] || 277;
  var total = val * rate;
  result.innerHTML = '<span class="text-2xl font-black text-[#D4AF37]">'+total.toLocaleString()+' PKR</span><br><span class="text-[11px] text-white/40">1 '+curr+' = '+rate.toLocaleString()+' PKR • Live rate</span>';
}
window.convertCurrency = function(){ updateConverterDisplay(); };

// Help Chat
window.sendHelpMessage = function(){
  var input = document.getElementById('helpInput');
  var text = input.value.trim();
  if(!text) return;
  var btn = document.getElementById('sendHelpBtn');
  btn.innerText = 'Sending...'; btn.disabled = true;
  addDoc(collection(db, 'helpMessages'), {
    userId: currentUser,
    userName: currentUser,
    message: text,
    createdAt: serverTimestamp(),
    replies: [],
    readByUser: true,
    readByAdmin: false,
    status: 'open'
  }).then(function(){
    input.value=''; btn.innerText='Send Message'; btn.disabled=false;
  }).catch(function(e){ alert('Error: '+e.message); btn.innerText='Send Message'; btn.disabled=false; });
};

window.replyToHelp = function(msgId){
  var input = document.getElementById('replyInput_'+msgId);
  var text = input.value.trim();
  if(!text) return;
  var msg = helpMessages.find(function(m){ return m.id===msgId; });
  if(!msg) return;
  var newReplies = msg.replies || [];
  newReplies.push({text: text, fromAdmin: false, fromUser: true, createdAt: new Date(), userName: currentUser});
  updateDoc(doc(db, 'helpMessages', msgId), {replies: newReplies, readByAdmin: false, readByUser: true}).then(function(){ input.value=''; });
};

  render(); 
  window.scrollTo({top:0, behavior:'smooth'});
};
